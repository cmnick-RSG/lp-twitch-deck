name: Update dashboard data

# Refreshes SullyGnome data and commits site/public/data.json so the deployed
# Vercel site shows fresh stats. Runtime is plain `requests` (no browser).
on:
  schedule:
    # Every 6h (UTC). Was every 2h until SullyGnome started 403-ing this repo's
    # Actions IP (outage 2026-08-09..08-18, analytics froze for 9 days). Scraping
    # it 4x/day instead of 24x keeps us well under its radar.
    # NOTE: the dashboard's real-time story does NOT depend on this workflow —
    # live-snapshot.yml (Twitch Helix, every 5-10 min) and /api/live feed the Live
    # tab. This job only refreshes SullyGnome aggregates, which lag by hours anyway.
    - cron: "0 */6 * * *"
  workflow_dispatch:          # manual "Run workflow" button
    inputs:
      force:
        description: "Run even if data.json is still fresh (bypass the 6h self-throttle)"
        type: boolean
        default: false

env:
  # SullyGnome only accepts specific day windows (3/7/30/365) — others return empty!
  LP_RECENT_WINDOW: "7"      # scan channels active in the last 7 days (fills recent gaps)
  LP_STREAM_WINDOW: "30"     # pull each channel's last 30 days of streams (backfill depth)

permissions:
  contents: write             # allow committing data back to the repo

concurrency:
  group: site-refresh        # shared with live-snapshot.yml so pushes never race
  cancel-in-progress: false

jobs:
  # Self-throttle. This workflow is fired by BOTH the schedule above and an
  # external cron-job.org workflow_dispatch, so the two used to stack up and hit
  # SullyGnome ~24x/day — which got this repo's Actions IP 403'd for 9 days
  # (2026-08-09..08-18). The guard skips a run whose data.json is still fresh, so
  # the real scrape rate stays ~6h NO MATTER how often something triggers us.
  # Tick "force" on a manual run to bypass it.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          MIN_AGE_H=5      # allow a little schedule drift under the 6h target
          if [ "$FORCE" = "true" ]; then
            echo "force=true -> running"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # explicit utf-8: data.json carries CJK/Cyrillic channel names, and a
          # locale-dependent open() would blow up and silently disable the throttle
          GEN=$(python3 -c "import json,io;print(json.load(io.open('site/public/data.json',encoding='utf-8')).get('generated_at',''))" 2>/dev/null || true)
          if [ -z "$GEN" ]; then
            echo "no generated_at in data.json -> running"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AGE=$(python3 -c "import datetime as d;print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat('$GEN')).total_seconds()//3600))")
          echo "data.json generated_at=$GEN (age ${AGE}h, threshold ${MIN_AGE_H}h)"
          if [ "$AGE" -ge "$MIN_AGE_H" ]; then
            echo "stale -> running"; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "still fresh -> skipping this trigger (protects the SullyGnome IP)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Collect SullyGnome channel + chart data
        run: python sullygnome_collector.py

      - name: Collect recent Last Pirates streams
        run: python collect_streams.py

      - name: Collect short-window (hourly) + momentum
        run: python collect_recent.py

      - name: Refresh per-channel all-time meta (last stream + total streams, batched)
        run: python collect_channel_meta.py

      - name: Collect Twitch-first recent streams (Helix videos by game)
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python collect_videos.py

      - name: Pull latest live history from the 'data' branch (snapshots live there now)
        # BEFORE enrich so enrich_helix can also resolve captured/live channels' VODs
        run: |
          curl -sfL "https://raw.githubusercontent.com/cmnick-RSG/lp-twitch-deck/data/site/public/live_history.json" \
            -o site/public/live_history.json || echo "[]" > site/public/live_history.json

      - name: Enrich streams with Twitch VOD data + per-channel VOD map (links/views/thumbs)
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python enrich_helix.py

      - name: Build site data.json
        run: python build_site_data.py

      - name: Commit refreshed data
        run: |
          git config user.name  "lp-deck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data.json site/public/roster.json site/public/channel_meta.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            # NOTE: no "[skip ci]" — Vercel honours that tag and would SKIP the deploy,
            # leaving the live site's data.json stale. We WANT this commit to deploy.
            # (No GitHub workflow triggers on push — only schedule/dispatch — so no CI loop.)
            git commit -m "data: refresh streams"
            # retry push with rebase — survives a race with a concurrent human/bot push
            for i in 1 2 3 4 5; do
              git push && break || { echo "push race, rebasing…"; git pull --rebase --autostash origin main; }
            done
          fi

      - name: Trigger Vercel deploy of the fresh data.json
        # Vercel's auto-deploy on bot pushes is unreliable here (prod ends up ~1 build
        # behind main). A deploy hook makes every 2h build publish deterministically.
        # Add the hook URL as repo secret VERCEL_DEPLOY_HOOK (Settings → Secrets → Actions).
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null && echo "Vercel deploy triggered." || echo "deploy hook call failed."
          else
            echo "No VERCEL_DEPLOY_HOOK secret set — relying on Vercel auto-deploy."
          fi

      # ---- Unrelated side-job: competitor coverage scan --------------------
      # Runs DEAD LAST so the entire dashboard path (collect → commit → deploy)
      # is already finished and untouched before this starts. Fully isolated:
      # it reads SullyGnome/Twitch and writes ONLY to a Google Sheet — it never
      # touches repo files, data.json, or git. if: always() = runs even if a
      # dashboard step failed; continue-on-error = its failure can't red this
      # run. Only fires on the 06:00 UTC hit (09:00 Kyiv); other 2h runs skip
      # instantly. Re-runs are harmless (deduped).
      - name: Competitor coverage scan (isolated, 06:00 UTC slot only)
        if: always()
        continue-on-error: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          LP_COMP_MIN: "100"
          LP_MIN_FOLLOWERS: "1000"
        run: |
          H=$(date -u +%H)
          # accept 06 OR 07: GitHub schedules drift 20-50 min, and a run that
          # slips past the hour must not silently skip the daily scan.
          if [ "$H" = "06" ] || [ "$H" = "07" ]; then
            echo "06:00 UTC slot — running competitor coverage scan"
            pip install gspread google-auth
            python competitor_scan.py
          else
            echo "hour=$H UTC (not 06) — skipping competitor scan this run"
          fi
